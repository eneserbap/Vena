# ─────────────────────────────────────────────────────────────────────────────
# Hydra Configuration — conf/config.yaml
#
# WHY Hydra?
#   Hydra lets us compose, override, and sweep configurations from the CLI
#   without changing a single line of Python.  Every hyperparameter lives here
#   so the code remains environment-agnostic and fully reproducible.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  raw_path: "data/raw/healthcare-dataset-stroke-data.csv"
  processed_dir: "data/processed"
  # Fraction of data used for the test split (stratified on the label)
  test_size: 0.2
  # Controls random state for reproducible splits across runs
  random_seed: 42
  # Name of the binary label column in the raw CSV
  target_column: "stroke"
  # Columns to drop before feature engineering (non-informative identifiers)
  drop_columns:
    - "id"

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # Blueprint: IEEE 2026 CCAI Dual-Tower Transformer Framework
  architecture: "DualTowerStrokeTransformer" # Options: DualTowerStrokeTransformer, StrokeMLP
  # Number of input features after preprocessing
  input_dim: 19
  # Transformer Latent Dimensions (Table II from IEEE Paper)
  d_model: 64
  nhead: 4
  num_layers: 2
  d_cat: 32
  # Neuron counts for MLP fallback
  hidden_layers:
    - 64
    - 32
  # Output dim is 1 for binary classification with BCEWithLogitsLoss
  output_dim: 1
  # Dropout probability applied to attention and MLP heads
  dropout: 0.15

# ── Training ──────────────────────────────────────────────────────────────────
training:
  learning_rate: 5.0e-4 # Tuned optimal rate from IEEE paper Table II
  batch_size: 64
  epochs: 50
  weight_decay: 3.0e-4
  # Patience for early stopping
  early_stopping_patience: 10
  # Exact class weighting: 4861 negative / 249 positive ≈ 19.52
  pos_weight: 19.52

# ── Logging & Artefacts ───────────────────────────────────────────────────────
artefacts:
  # Directory where trained model checkpoints are saved
  checkpoint_dir: "outputs/checkpoints"
  # Filename for the best model snapshot
  best_model_name: "vena_best.pt"
